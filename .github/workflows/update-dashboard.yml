name: Update Magnite dashboard

on:
  schedule:
    # Target: ~11:00 Europe/Madrid (09:00 UTC in summer). GitHub cron can
    # drift by an hour or more under load — the job simply runs whenever it
    # fires; no time guard (a strict guard silently skipped delayed runs).
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          DRIVE_SA: ${{ secrets.DRIVE_SA }}
        run: |
          echo "$GOOGLE_TOKEN" > token.json
          echo "$DRIVE_SA" > drive_sa.json

      - name: Rebuild dashboard from Trino and upload to Drive
        env:
          TRINO_USER: ${{ secrets.TRINO_USER }}
          DRIVE_SA_JSON: drive_sa.json
        run: python scripts/update_dashboard.py --upload

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add index.html data/date_snapshots.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily dashboard refresh $(TZ=Europe/Madrid date +%F)"
            git push
          fi
