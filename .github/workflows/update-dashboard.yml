name: Update Magnite dashboard

on:
  schedule:
    # 11:00 Europe/Madrid — cron is UTC, so fire at both 09:00 and 10:00 UTC
    # and let the guard step keep only the run where Madrid time is 11:xx.
    - cron: '0 9,10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — only run at 11:00 Madrid time (skip for manual runs)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Madrid date +%H)" = "11" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Write Google OAuth token
        if: steps.guard.outputs.run == 'true'
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: echo "$GOOGLE_TOKEN" > token.json

      - name: Rebuild dashboard from Trino
        if: steps.guard.outputs.run == 'true'
        env:
          TRINO_USER: ${{ secrets.TRINO_USER }}
        run: python scripts/update_dashboard.py

      - name: Commit and push if changed
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html magnite_connection_health_latest.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily dashboard refresh $(TZ=Europe/Madrid date +%F)"
            git push
          fi
